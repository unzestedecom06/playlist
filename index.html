
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify ORGA'NOTION</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: stretch;
    }

    .widget {
      width: 100%;
      height: 100%;
      min-height: 400px;
      background: #f8c74b;
      border-radius: 7px;
      padding: 10px;
      overflow: hidden;
    }

    .spotify {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 6px;
      display: block;
    }
  </style>
</head>

<body>
  <div class="widget">
    <iframe
      class="spotify"
      src="https://open.spotify.com/embed/playlist/6sWNtqsq1ip2quKm6U3UvD?utm_source=generator"
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
      loading="lazy"
      title="Playlist Piano Covers">
    </iframe>
  </div>
</body>
</html>
