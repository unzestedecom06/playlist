
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ma playlist ORGA'NOTION</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      font-family: 'Poppins', sans-serif;
    }

    .widget {
      width: 100%;
      height: 100%;
      background: #f8c74b;
      color: #fffbe2;
      border-radius: 7px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      overflow: hidden;
    }

    .entete {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .surtitre {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
    }

    .icone {
      font-size: 22px;
    }

    .pochette {
      width: min(100%, 205px);
      aspect-ratio: 1;
      margin: 0 auto;
      background: #fffbe2;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 1;
      min-height: 0;
    }

    .pochette-interieur {
      text-align: center;
      color: #b58416;
      padding: 12px;
    }

    .pochette-interieur .piano {
      font-size: clamp(30px, 7vw, 56px);
      line-height: 1;
    }

    .pochette-interieur span {
      display: block;
      margin-top: 10px;
      font-size: 18px;
      font-weight: 800;
      line-height: 1.2;
    }

    .informations {
      text-align: center;
    }

    .informations h1 {
      font-size: clamp(18px, 6vw, 26px);
      line-height: 1.2;
      margin: 0;
      font-weight: 800;
    }

    .informations p {
      font-size: 12px;
      margin: 5px 0 0;
      opacity: 0.95;
    }

    .ouvrir {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 9px;
      background: #fffbe2;
      color: #b58416;
      padding: 13px 12px;
      border-radius: 30px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      transition: transform 0.2s;
    }

    .ouvrir:hover {
      transform: scale(1.03);
    }

    .liste {
      border-top: 1px solid #fffbe288;
      padding-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .morceau {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      font-weight: 500;
    }

    .numero {
      opacity: 0.75;
      font-weight: 700;
      min-width: 18px;
    }

    .titre {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    @media (max-height: 430px) {
      .widget { padding: 12px; gap: 8px; }
      .liste { gap: 5px; padding-top: 8px; }
      .pochette { max-width: 140px; }
      .ouvrir { padding: 9px; }
    }
  </style>
</head>

<body>
  <div class="widget">

    <div class="entete">
      <span class="surtitre">MA PLAYLIST</span>
      <span class="icone">♫</span>
    </div>

    <div class="pochette">
      <div class="pochette-interieur">
        <div class="piano">♫</div>
        <span>PIANO<br>COVERS</span>
      </div>
    </div>

    <div class="informations">
      <h1>Piano Covers</h1>
      <p>Prime Feelings · Spotify</p>
    </div>

    <a
      class="ouvrir"
      href="https://open.spotify.com/playlist/6sWNtqsq1ip2quKm6U3UvD"
      target="_blank"
      rel="noopener noreferrer">
      ▶ &nbsp; Écouter sur Spotify ↗
    </a>

    <div class="liste">
      <div class="morceau">
        <span class="numero">01</span>
        <span class="titre">Someone Like You — Piano</span>
      </div>
      <div class="morceau">
        <span class="numero">02</span>
        <span class="titre">Everglow — Piano Version</span>
      </div>
      <div class="morceau">
        <span class="numero">03</span>
        <span class="titre">Blinding Lights — Piano</span>
      </div>
    </div>

  </div>
</body>
</html>
